<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eeeeee" id="browser-theme-color">
    <title>Untitled - Jupyter Notebook</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Jupyter Notebook home"><span class="brand-mark" aria-hidden="true"></span><span>Jupyter</span></a>
            <div class="doc-title"><span id="notebook-title">Untitled</span><span class="checkpoint">Last Checkpoint: now</span></div>
            <div class="topbar-actions">
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch theme"><span class="theme-symbol" aria-hidden="true"></span></button>
                <span class="python-mark" >
  <img src="https://s3.dualstack.us-east-2.amazonaws.com/pythondotorg-assets/media/community/logos/python-logo-only.png"
       >
</span>
            </div>
        </header>

        <nav class="menubar" aria-label="Notebook menus">
            <button class="menu-item" type="button">File</button>
            <button class="menu-item" type="button">Edit</button>
            <button class="menu-item" type="button">View</button>
            <button class="menu-item" type="button">Run</button>
            <button class="menu-item" type="button">Kernel</button>
            <button class="menu-item" type="button">Settings</button>
            <button class="menu-item" type="button">Help</button>
            
        </nav>

        <div class="toolbar" role="toolbar" aria-label="Notebook toolbar">
            <div class="toolbar-actions">
                <button class="tool-button" type="button" title="Save notebook" aria-label="Save notebook"><span aria-hidden="true">▣</span></button>
                <button class="tool-button" id="add-inline-button" type="button" title="Add code cell" aria-label="Add code cell"><span aria-hidden="true">＋</span></button>
                <button class="tool-button" type="button" title="Cut cells" aria-label="Cut cells"><span aria-hidden="true">✂</span></button>
                <button class="tool-button" id="copy-all-button" type="button" title="Copy all code" aria-label="Copy all code" disabled><span aria-hidden="true">▢</span></button>
                <button class="tool-button" type="button" title="Paste cells" aria-label="Paste cells"><span aria-hidden="true">▤</span></button>
                <button class="tool-button" type="button" title="Run cell" aria-label="Run cell"><span aria-hidden="true">▶</span></button>
                <button class="tool-button" type="button" title="Interrupt kernel" aria-label="Interrupt kernel"><span aria-hidden="true">■</span></button>
                <button class="tool-button" id="refresh-button" type="button" title="Restart kernel / refresh notebook" aria-label="Refresh notebook"><span aria-hidden="true">↻</span></button>
                <button class="tool-button" type="button" title="Restart kernel and run all cells" aria-label="Restart and run all"><span aria-hidden="true">»</span></button>
            </div>
            <span class="toolbar-divider"></span>
            <select class="cell-type-picker" aria-label="Cell type"><option>Code</option><option>Markdown</option><option>Raw</option></select>
            <span class="toolbar-spacer"></span>
            <button class="toolbar-link" type="button" title="Open JupyterLab">JupyterLab <span aria-hidden="true">↗</span></button>
            <button class="tool-button settings-button" type="button" title="Settings" aria-label="Settings"><span aria-hidden="true">⚙</span></button>
            <select class="notebook-picker" id="notebook-picker" aria-label="Select notebook"></select>
            <span class="kernel-dot" aria-hidden="true"></span>
            <span class="cell-total sr-only" id="cell-count">0 cells</span>
            <span class="sr-only" id="connection-status">Connected</span>
        </div>

        <main class="notebook-canvas" aria-label="Code notebook">
            <div class="notebook-sheet">
                <div class="cells" id="cells" aria-live="polite"></div>
                <section class="empty-state" id="empty-state" hidden><div class="empty-mark" aria-hidden="true">[ ]</div><h1>This notebook is empty.</h1></section>
            </div>
        </main>
    </div>

    <dialog class="create-dialog" id="create-dialog" aria-labelledby="dialog-title">
        <form id="create-form">
            <div class="dialog-top"><div><p class="eyebrow">NEW TEXT FILE</p><h2 id="dialog-title">Add a snippet</h2></div><button class="close-button" id="close-dialog" type="button" aria-label="Close">×</button></div>
            <label class="field-label" for="filename">File name</label><div class="filename-field"><input id="filename" name="filename" type="text" placeholder="my_snippet" maxlength="80" required><span>.txt</span></div>
            <label class="field-label" for="code-content">Code</label><textarea id="code-content" name="content" rows="10" placeholder="# Paste or write your code"></textarea>
            <p class="dialog-hint">Saved to <code>code_files/</code>. The code is displayed only; it will never be executed.</p>
            <p class="form-error" id="form-error" role="alert"></p>
            <div class="dialog-actions"><button class="button button-quiet" id="cancel-dialog" type="button">Cancel</button><button class="button button-primary" type="submit">Save text file</button></div>
        </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
