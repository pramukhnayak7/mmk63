<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eeeeee" id="browser-theme-color">
    <title>Untitled - Jupyter Notebook</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Jupyter Notebook home"><span class="brand-mark" aria-hidden="true"></span><span>Jupyter</span></a>
            <div class="doc-title"><span id="notebook-title">Untitled</span><span class="checkpoint">Last Checkpoint: now</span></div>
            <span class="python-mark" aria-label="Python 3">Py</span>
        </header>

        <nav class="menubar" aria-label="Notebook menus">
            <button class="menu-item" id="add-button" type="button" title="Create a text-backed code cell">File</button>
            <button class="menu-item" id="menu-copy-button" type="button" title="Copy all code">Edit</button>
            <button class="menu-item theme-menu" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span>View</span><span class="theme-symbol" aria-hidden="true">☾</span><span class="theme-name">Dark</span></button>
            <span class="menu-label">Kernel</span>
            <a class="menu-item help-link" href="https://jupyter-notebook.readthedocs.io/" target="_blank" rel="noreferrer">Help</a>
        </nav>

        <div class="toolbar" role="toolbar" aria-label="Notebook toolbar">
            <div class="toolbar-actions">
                <button class="tool-button" id="add-inline-button" type="button" title="Add code cell"><span aria-hidden="true">＋</span></button>
                <button class="tool-button" id="copy-all-button" type="button" title="Copy all code" disabled><span aria-hidden="true">▣</span></button>
                <button class="tool-button" id="refresh-button" type="button" title="Refresh text files"><span aria-hidden="true">↻</span></button>
            </div>
            <span class="toolbar-divider"></span>
            <span class="cell-total" id="cell-count">0 cells</span>
            <span class="toolbar-spacer"></span>
            <span class="kernel-status"><span class="kernel-dot"></span><span>Python 3 (read only)</span></span>
            <span class="connection-status" id="connection-status">Connected</span>
        </div>

        <main class="notebook-canvas" aria-label="Code notebook">
            <div class="notebook-sheet">
                <div class="cells" id="cells" aria-live="polite"></div>
                <section class="empty-state" id="empty-state" hidden><div class="empty-mark" aria-hidden="true">[ ]</div><h1>Untitled</h1><p>This notebook is empty.</p><button class="empty-add-button" id="empty-add-button" type="button">Add code cell</button></section>
                <div class="add-cell-row"><span></span><button id="add-cell-bottom" type="button" title="Add code cell">＋</button><span></span></div>
            </div>
        </main>
    </div>

    <dialog class="create-dialog" id="create-dialog" aria-labelledby="dialog-title">
        <form id="create-form">
            <div class="dialog-top"><div><p class="eyebrow">NEW TEXT FILE</p><h2 id="dialog-title">Add a snippet</h2></div><button class="close-button" id="close-dialog" type="button" aria-label="Close">×</button></div>
            <label class="field-label" for="filename">File name</label><div class="filename-field"><input id="filename" name="filename" type="text" placeholder="my_snippet" maxlength="80" required><span>.txt</span></div>
            <label class="field-label" for="code-content">Code</label><textarea id="code-content" name="content" rows="10" placeholder="# Paste or write your code"></textarea>
            <p class="dialog-hint">Saved to <code>code_files/</code>. The code is displayed only; it will never be executed.</p>
            <p class="form-error" id="form-error" role="alert"></p>
            <div class="dialog-actions"><button class="button button-quiet" id="cancel-dialog" type="button">Cancel</button><button class="button button-primary" type="submit">Save text file</button></div>
        </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
